# Réglages pnpm. Autorise explicitement les scripts d'installation (binaires natifs).
# pnpm 11 exige un choix true/false par paquet via "allowBuilds".
allowBuilds:
  '@biomejs/biome': true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Applications du monorepo. La racine reste THE PILOT (Seven At Home) ;
# apps/lead est THE PILOT LEAD (Breach / MonExpertPatrimoine), logiciel
# indépendant : propre process, propre URL, propres secrets, propre base.
packages:
  - 'apps/*'
